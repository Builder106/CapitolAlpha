[project]
name = "capitol-alpha"
version = "0.1.0"
description = "Congressional trading & financial analysis pipeline."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "pdfplumber>=0.11.10",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "playwright>=1.61.0",
    "ruff",
]

[tool.uv]
package = false
default-groups = []

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
src = ["pipeline", "tests", "run_pipeline.py"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
]
ignore = [
    "E501", # Line too long
    "W293", # Blank line contains whitespace
    "W291", # Trailing whitespace
    "E402", # Module level import not at top of file
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
