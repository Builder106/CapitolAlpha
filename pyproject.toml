[project]
name = "capitol-alpha"
version = "0.1.0"
description = "Congressional trading & financial analysis pipeline."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "pdfplumber>=0.11.10",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "playwright>=1.61.0",
    "ruff",
]

[tool.uv]
package = false
default-groups = []

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:.*found in sys.modules after import of package.*:RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
